<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Specification Recorder" />
  <title>Specification Recorder</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=34" />
  <link rel="stylesheet" href="styles.css?v=34" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Specification <span>Recorder</span></h1>
      <input class="rep-name" id="recordName" type="text"
             placeholder="Name this record…" autocomplete="off" />
    </header>

    <!-- ============ ENTRY PAGE ============ -->
    <section class="page page--entry" id="pageEntry">
      <div class="spec-inputs spec-inputs--entry">
        <label class="spec-field">
          <span>Lower (LSL)</span>
          <input id="lowEntry" type="text" inputmode="decimal" placeholder="" autocomplete="off" />
        </label>
        <label class="spec-field">
          <span>Upper (USL)</span>
          <input id="highEntry" type="text" inputmode="decimal" placeholder="" autocomplete="off" />
        </label>
        <label class="spec-field">
          <span>Step</span>
          <input id="stepInput" type="text" inputmode="decimal" placeholder="0.1" autocomplete="off" />
        </label>
      </div>

      <div class="mode-toggle">
        <button type="button" class="mode-btn is-active" id="modeQuick">Quick tap</button>
        <button type="button" class="mode-btn" id="modeManual">Manual</button>
      </div>

      <div class="statline">
        <div class="statline__item"><b id="bigCount">0</b><span>reps</span></div>
        <div class="statline__item"><b id="qsAvg">–</b><span>avg</span></div>
        <div class="statline__item"><b id="qsMin">–</b><span>min</span></div>
        <div class="statline__item"><b id="qsMax">–</b><span>max</span></div>
      </div>

      <!-- QUICK-TAP MODE -->
      <div class="entry-pane" id="quickPane">
        <div class="extend-row">
          <button type="button" class="extend" id="addLower">＋ add lower</button>
          <button type="button" class="extend extend--minus" id="lowerLess" aria-label="Remove lowest value">－</button>
        </div>
        <div class="value-grid" id="valueGrid"></div>
        <div class="extend-row">
          <button type="button" class="extend" id="addHigher">＋ add higher</button>
          <button type="button" class="extend extend--minus" id="higherLess" aria-label="Remove highest value">－</button>
        </div>
        <p class="quick-hint" id="quickHint">
          Enter a Lower &amp; Upper limit above to get tap buttons.
        </p>
      </div>

      <!-- MANUAL (KEYPAD) MODE -->
      <div class="entry-pane hidden" id="manualPane">
        <form class="entry-form" id="entryForm" autocomplete="off">
          <input
            class="entry-input"
            id="entryInput"
            type="text"
            inputmode="none"
            enterkeyhint="enter"
            placeholder="Tap numbers below"
            autocomplete="off" />
        </form>

        <div class="keypad" id="keypad">
          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key key--fn" data-action="sign" aria-label="Toggle negative">±</button>
          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key" data-key="." aria-label="Decimal point">.</button>
        </div>

        <div class="keypad-actions" id="keypadActions">
          <button type="button" class="btn btn--ghost key-space" data-action="space">Next #</button>
          <button type="button" class="btn btn--ghost key-back" data-action="back" aria-label="Backspace">⌫</button>
          <button type="button" class="btn btn--add key-enter" data-action="enter">Enter</button>
        </div>
      </div>

      <div class="entry-actions">
        <button class="btn btn--ghost" id="undoBtn" type="button">Undo last</button>
        <button class="btn btn--ghost btn--danger" id="clearBtn" type="button">Clear all</button>
      </div>
    </section>

    <!-- ============ SUMMARY PAGE ============ -->
    <section class="page page--summary hidden" id="pageSummary">
      <h2 class="summary-title" id="summaryTitle">Summary</h2>

      <div class="stat-grid">
        <div class="stat-card"><span class="stat-card__label">Replications</span><span class="stat-card__val" id="sumCount">0</span></div>
        <div class="stat-card"><span class="stat-card__label">Average</span><span class="stat-card__val" id="sumAvg">–</span></div>
        <div class="stat-card"><span class="stat-card__label">Median</span><span class="stat-card__val" id="sumMedian">–</span></div>
        <div class="stat-card"><span class="stat-card__label">Mode</span><span class="stat-card__val" id="sumMode">–</span></div>
        <div class="stat-card"><span class="stat-card__label">Minimum</span><span class="stat-card__val" id="sumMin">–</span></div>
        <div class="stat-card"><span class="stat-card__label">Maximum</span><span class="stat-card__val" id="sumMax">–</span></div>
        <div class="stat-card"><span class="stat-card__label">Range</span><span class="stat-card__val" id="sumRange">–</span></div>
      </div>

      <div class="spec-box">
        <h3 class="spec-box__title">Specification limits</h3>
        <div class="spec-inputs">
          <label class="spec-field">
            <span>Lower (LSL)</span>
            <input id="lslInput" type="text" inputmode="decimal" placeholder="" autocomplete="off" />
          </label>
          <label class="spec-field">
            <span>Upper (USL)</span>
            <input id="uslInput" type="text" inputmode="decimal" placeholder="" autocomplete="off" />
          </label>
        </div>

        <div class="spec-donut">
          <div class="ring" id="specRing">
            <div class="ring__txt"><b id="pctIn">–</b><small>in spec</small></div>
          </div>
          <div class="legend">
            <div class="lg lg--under"><span class="l"><i class="dot dot--under"></i>Under</span><b id="pctUnder">–</b></div>
            <div class="lg lg--in"><span class="l"><i class="dot dot--in"></i>In spec</span><b id="pctInLeg">–</b></div>
            <div class="lg lg--over"><span class="l"><i class="dot dot--over"></i>Over</span><b id="pctOver">–</b></div>
          </div>
        </div>
      </div>

      <div class="hist-box">
        <h3 class="hist-box__title">Distribution</h3>
        <div class="hist" id="histogram"></div>
        <div class="hist-legend" id="histLegend">
          <span class="hist-legend__item"><i class="dot dot--under"></i>under</span>
          <span class="hist-legend__item"><i class="dot dot--in"></i>in spec</span>
          <span class="hist-legend__item"><i class="dot dot--over"></i>over</span>
        </div>
      </div>

      <div class="summary-actions">
        <button class="btn btn--ghost" id="exportBtn" type="button">Export CSV</button>
      </div>

      <div class="all-values">
        <h3 class="all-values__title">All replications</h3>
        <ol class="all-values__list" id="allValuesList"></ol>
      </div>
    </section>

    <!-- ============ BOTTOM NAV ============ -->
    <nav class="tabbar">
      <button class="tab is-active" id="tabEntry" type="button">
        <span class="tab__icon">＃</span><span class="tab__text">Enter</span>
      </button>
      <button class="tab" id="tabSummary" type="button">
        <span class="tab__icon">∑</span><span class="tab__text">Summary</span>
      </button>
    </nav>
  </div>

  <script src="app.js?v=34"></script>
</body>
</html>
